[package]
name = "cyoa-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cyoa-desktop"
path = "src/main.rs"

[dependencies]
cyoa-engine = { path = "../cyoa-engine" }
cyoa-core = { path = "../cyoa-core" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.18.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7.20"
serde = { version = "1.0.229", features = ["derive"] }
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
