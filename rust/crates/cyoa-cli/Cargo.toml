[package]
name = "cyoa-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cyoa-downloader"
path = "src/main.rs"

[dependencies]
cyoa-engine = { path = "../cyoa-engine" }
cyoa-core = { path = "../cyoa-core" }
cyoa-net = { path = "../cyoa-net" }
cyoa-storage = { path = "../cyoa-storage" }
clap = { version = "4.6.8", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7.20"
serde_json = "1.0.154"
tracing = "0.1.44"

[lints]
workspace = true
