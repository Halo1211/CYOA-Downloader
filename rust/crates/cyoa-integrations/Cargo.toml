[package]
name = "cyoa-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cyoa-core = { path = "../cyoa-core" }
cyoa-net = { path = "../cyoa-net" }
cyoa-parse = { version = "0.1.0", path = "../cyoa-parse" }
cyoa-storage = { path = "../cyoa-storage" }
percent-encoding = "2.3.2"
regex = "1.13.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["local-offset"] }
tokio = "1.54.1"
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[lints]
workspace = true
