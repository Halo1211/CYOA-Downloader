[package]
name = "cyoa-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cyoa-core = { path = "../cyoa-core" }
cyoa-net = { path = "../cyoa-net" }
cyoa-storage = { path = "../cyoa-storage" }
regex = "1.13.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["local-offset"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
