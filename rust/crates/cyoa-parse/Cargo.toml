[package]
name = "cyoa-parse"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cyoa-core = { path = "../cyoa-core" }
cyoa-storage = { version = "0.1.0", path = "../cyoa-storage" }
encoding_rs = "0.8.44"
json5 = "1.3.7"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
