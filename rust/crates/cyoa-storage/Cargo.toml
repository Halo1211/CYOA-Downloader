[package]
name = "cyoa-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cyoa-core = { path = "../cyoa-core" }
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
