[package]
name = "cyoa-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cyoa-core = { path = "../cyoa-core" }
cyoa-storage = { path = "../cyoa-storage" }
cyoa-net = { path = "../cyoa-net" }
cyoa-parse = { path = "../cyoa-parse" }
regex = "1.13.1"
thiserror = "2.0.21"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
percent-encoding = "2.3.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
url = "2.5.8"
tracing = "0.1.44"

zip = { version = "9.6.1", default-features = false, features = ["deflate"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
time = { version = "0.3.55", features = ["local-offset"] }
psl = "2.1.256"
csv = "1.4.0"
fancy-regex = "0.11.0"

[dev-dependencies]
wiremock = "0.6.5"
tempfile = "3"

[lints]
workspace = true


