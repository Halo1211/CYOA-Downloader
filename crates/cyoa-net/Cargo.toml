[package]
name = "cyoa-net"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
serde_json = "1.0.154"
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "native-tls", "stream", "socks", "cookies", "http2", "gzip", "brotli", "deflate", "charset"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
tracing = "0.1.44"
url = "2.5.8"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy"] }
http = "1"
percent-encoding = "2.3.2"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"
