name: Rust Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up Python for license packaging
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build Rust applications
        run: cargo build --release -p cyoa-cli -p cyoa-desktop
      - name: Verify CLI binaries
        shell: pwsh
        run: |
          .\target\release\cyoa-downloader.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\target\release\cyoa-downloader.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package applications and licenses
        shell: pwsh
        run: |
          $package = "dist/CYOA-Downloader-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$package/LICENSES" | Out-Null
          Copy-Item target/release/cyoa-downloader.exe, target/release/cyoa-desktop.exe -Destination $package
          Copy-Item README.md, LICENSE, docs/RUST_GUIDE.md -Destination $package
          python scripts/third_party_notices.py --bundle "$package/LICENSES"
          Copy-Item docs/THIRD_PARTY_NOTICES.md -Destination $package
          Compress-Archive -Path "$package/*" -DestinationPath dist/CYOA-Downloader-Windows-x64.zip -Force
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: CYOA-Downloader-Windows-x64
          path: dist/CYOA-Downloader-Windows-x64.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/CYOA-Downloader-Windows-x64.zip