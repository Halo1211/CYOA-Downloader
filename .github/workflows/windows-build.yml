name: Rust Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: rust-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up Python for license packaging
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build desktop application
        run: cargo build --locked --release -p cyoa-desktop
      - name: Verify desktop executable
        shell: pwsh
        run: |
          $binary = "target/release/cyoa-desktop.exe"
          if (-not (Test-Path $binary)) { throw "Desktop executable was not produced" }
          Get-Item $binary | Select-Object Name, Length
      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/cyoa-desktop.exe dist/CYOA-Downloader-Windows-x64.exe -Force
          $licenses = "dist/CYOA-Downloader-Third-Party-Licenses"
          python scripts/third_party_notices.py --bundle $licenses
          Copy-Item docs/THIRD_PARTY_NOTICES.md $licenses
          Compress-Archive -Path "$licenses/*" -DestinationPath dist/CYOA-Downloader-Third-Party-Licenses.zip -Force
      - name: Upload single executable artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/CYOA-Downloader-Windows-x64.exe
          archive: false
          if-no-files-found: error
      - name: Upload third-party licenses artifact
        uses: actions/upload-artifact@v7
        with:
          name: CYOA-Downloader-Third-Party-Licenses
          path: dist/CYOA-Downloader-Third-Party-Licenses.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: "Download the standalone Windows desktop executable and the companion third-party license bundle."
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/CYOA-Downloader-Windows-x64.exe
            dist/CYOA-Downloader-Third-Party-Licenses.zip
