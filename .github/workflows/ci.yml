name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install GTK build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libxdo-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  python-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: old
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system packages
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile cyoa_downloader.py
      - name: CLI help
        run: python cyoa_downloader.py --help
      - name: Repository and documentation checks
        run: python tools/check_repository.py --root ..
      - name: Dependency check
        run: python cyoa_downloader.py --dependency-check
      - name: Self test
        run: python cyoa_downloader.py --self-test
      - name: Pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .